<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>주식 수익률 계산기 - 매수가·매도가·수익금 계산 | 머니계산기</title><meta name="description" content="매수가, 매도가, 수량을 입력해 주식 수익률과 예상 수익금 또는 손실금을 계산하세요."><style>body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f6f7f9;color:#16181d;line-height:1.65}.wrap{max-width:780px;margin:auto;padding:24px 16px 56px}a{color:#111827}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;margin:14px 0}label{display:block;font-size:14px;font-weight:700;color:#6b7280;margin:10px 0 6px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #e5e7eb;border-radius:12px;font-size:16px}button{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:#111827;color:#fff;font-weight:800;font-size:16px}.result{background:#eef2f7;border-radius:14px;padding:16px;margin-top:16px}.big{font-size:28px;font-weight:900}.row{display:flex;justify-content:space-between;gap:12px;margin:8px 0}.muted{color:#6b7280;font-size:14px}</style></head><body><div class="wrap"><a href="index.html">← 머니계산기 홈</a><h1>주식 수익률 계산기</h1><p class="muted">매수가와 매도가를 기준으로 손익과 수익률을 계산합니다.</p><div class="card"><label>매수가</label><input id="buy" type="number" value="50000"><label>매도가</label><input id="sell" type="number" value="60000"><label>수량</label><input id="qty" type="number" value="100"><button onclick="calc()">계산하기</button><div class="result"><div class="big" id="rate">-</div><div class="muted">수익률</div></div><div class="row"><span>매수금액</span><strong id="cost">-</strong></div><div class="row"><span>매도금액</span><strong id="proceeds">-</strong></div><div class="row"><span>예상 손익</span><strong id="profit">-</strong></div></div><div class="card"><h2>계산 기준</h2><p>수익률은 (매도가 - 매수가) ÷ 매수가 × 100으로 계산합니다. 수량을 입력하면 총 매수금액과 매도금액, 손익도 함께 보여줍니다.</p><p class="muted">거래 수수료와 세금은 포함하지 않습니다.</p></div><script>const f=n=>new Intl.NumberFormat('ko-KR',{maximumFractionDigits:0}).format(Math.round(n))+'원';function calc(){const B=+buy.value||0,S=+sell.value||0,Q=+qty.value||0;const C=B*Q,P=S*Q,PF=P-C,R=B?((S-B)/B)*100:0;cost.textContent=f(C);proceeds.textContent=f(P);profit.textContent=f(PF);rate.textContent=R.toFixed(2)+'%'}calc()</script></div></body></html>
