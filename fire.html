<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIRE 계산기 - 경제적 자유 목표자산 계산 | 머니계산기</title><meta name="description" content="월 생활비와 연 인출률을 입력해 경제적 자유에 필요한 목표자산을 계산합니다."><style>body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f6f7f9;color:#16181d}.wrap{max-width:780px;margin:auto;padding:24px 16px 56px}a{color:#111827}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;margin:14px 0}label{display:block;font-size:14px;font-weight:700;color:#6b7280;margin:10px 0 6px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #e5e7eb;border-radius:12px;font-size:16px}button{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:#111827;color:#fff;font-weight:800;font-size:16px}.result{background:#eef2f7;border-radius:14px;padding:16px;margin-top:16px}.big{font-size:28px;font-weight:900}.row{display:flex;justify-content:space-between;gap:12px;margin:8px 0}.muted{color:#6b7280;font-size:14px}</style></head><body><div class="wrap"><a href="index.html">← 머니계산기 홈</a><h1>FIRE 목표자산 계산기</h1><p class="muted">원하는 월 생활비와 연 인출률로 필요한 목표자산을 계산합니다.</p><div class="card"><label>월 생활비</label><input id="monthly" type="number" value="3000000"><label>연 인출률 (%)</label><input id="rate" type="number" value="4" step="0.1"><button onclick="calc()">계산하기</button><div class="result"><div class="big" id="target">-</div><div class="muted">예상 필요 목표자산</div></div><div class="row"><span>연간 생활비</span><strong id="annual">-</strong></div><div class="row"><span>자산배수</span><strong id="multiple">-</strong></div></div><div class="card"><h2>계산 방식</h2><p>연간 생활비를 연 인출률로 나누어 목표자산을 계산합니다. 예를 들어 연 인출률 4%는 연간 생활비의 약 25배입니다.</p><p class="muted">인출률은 미래 수익률, 물가, 세금, 기간에 따라 달라질 수 있으므로 참고용으로 사용하세요.</p></div><script>const f=n=>new Intl.NumberFormat('ko-KR',{maximumFractionDigits:0}).format(Math.round(n))+'원';function calc(){let m=+monthly.value||0,r=(+rate.value||0)/100,a=m*12,t=r>0?a/r:0;annual.textContent=f(a);target.textContent=r>0?f(t):'-';multiple.textContent=r>0?(1/r).toFixed(1)+'배':'-'}calc()</script></div></body></html>
