<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>예금 이자 계산기 - 세전·세후 만기금액 계산 | 머니계산기</title><meta name="description" content="예치금, 연 이율, 기간, 세율을 입력해 예금의 세전 이자, 세후 이자, 예상 만기금액을 계산하세요."><style>body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f6f7f9;color:#16181d;line-height:1.65}.wrap{max-width:780px;margin:auto;padding:24px 16px 56px}a{color:#111827}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;margin:14px 0}label{display:block;font-size:14px;font-weight:700;color:#6b7280;margin:10px 0 6px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #e5e7eb;border-radius:12px;font-size:16px}button{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:#111827;color:white;font-weight:800;font-size:16px}.result{background:#eef2f7;border-radius:14px;padding:16px;margin-top:16px}.big{font-size:28px;font-weight:900}.row{display:flex;justify-content:space-between;gap:12px;margin:8px 0}.muted{color:#6b7280;font-size:14px}</style></head><body><div class="wrap"><a href="index.html">← 머니계산기 홈</a><h1>예금 이자 계산기</h1><p class="muted">예치금과 금리를 기준으로 세전·세후 이자와 만기금액을 계산합니다.</p><div class="card"><label>예치금</label><input id="p" type="number" value="10000000"><label>연 이율 (%)</label><input id="r" type="number" value="3.5" step="0.1"><label>예치 기간 (개월)</label><input id="m" type="number" value="12"><label>이자소득 세율 (%)</label><input id="t" type="number" value="15.4" step="0.1"><button onclick="calc()">계산하기</button><div class="result"><div class="big" id="final">-</div><div class="muted">예상 세후 만기금액</div></div><div class="row"><span>세전 이자</span><strong id="gross">-</strong></div><div class="row"><span>세후 이자</span><strong id="net">-</strong></div></div><div class="card"><h2>계산 기준</h2><p>단리 기준으로 연 이율을 기간에 비례 적용합니다. 실제 금융상품은 이자 지급 방식, 우대금리, 중도해지 조건에 따라 결과가 달라질 수 있습니다.</p><h2>자주 묻는 질문</h2><h3>세율 15.4%는 무엇인가요?</h3><p>일반적인 이자소득 원천징수율을 참고값으로 넣은 것입니다. 개인 상황과 상품에 따라 다를 수 있습니다.</p></div><script>const f=n=>new Intl.NumberFormat('ko-KR',{maximumFractionDigits:0}).format(Math.round(n))+'원';function calc(){const P=+p.value||0,R=(+r.value||0)/100,M=+m.value||0,T=(+t.value||0)/100;const G=P*R*(M/12),N=G*(1-T);gross.textContent=f(G);net.textContent=f(N);final.textContent=f(P+N)}calc()</script></div></body></html>
