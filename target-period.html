<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>목표금액 도달기간 계산기 - 투자기간 계산 | 머니계산기</title><meta name="description" content="현재 자산, 목표금액, 연 수익률, 월 투자금으로 목표자산까지 걸리는 예상 기간을 계산하세요."><style>body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f6f7f9;color:#16181d;line-height:1.65}.wrap{max-width:780px;margin:auto;padding:24px 16px 56px}a{color:#111827}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;margin:14px 0}label{display:block;font-size:14px;font-weight:700;color:#6b7280;margin:10px 0 6px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #e5e7eb;border-radius:12px;font-size:16px}button{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:#111827;color:#fff;font-weight:800;font-size:16px}.result{background:#eef2f7;border-radius:14px;padding:16px;margin-top:16px}.big{font-size:28px;font-weight:900}.muted{color:#6b7280;font-size:14px}</style></head><body><div class="wrap"><a href="index.html">← 머니계산기 홈</a><h1>목표금액 도달기간 계산기</h1><p class="muted">현재 자산과 월 투자금으로 목표금액까지 걸리는 시간을 추정합니다.</p><div class="card"><label>현재 자산</label><input id="p" type="number" value="50000000"><label>목표금액</label><input id="target" type="number" value="300000000"><label>연 수익률 (%)</label><input id="r" type="number" value="7" step="0.1"><label>매월 투자금</label><input id="m" type="number" value="1000000"><button onclick="calc()">계산하기</button><div class="result"><div class="big" id="period">-</div><div class="muted">예상 목표 도달기간</div></div></div><div class="card"><h2>계산 기준</h2><p>연 수익률을 월 수익률로 환산하고 매월 수익 반영 후 추가 투자금을 더하는 방식으로 계산합니다.</p><p class="muted">수익률이 일정하다고 가정한 참고용 시뮬레이션입니다.</p></div><script>function calc(){let b=+p.value||0,T=+target.value||0,a=(+r.value||0)/100,add=+m.value||0,mr=Math.pow(1+a,1/12)-1,months=0,max=1200;if(b>=T){period.textContent='이미 목표 달성';return}if(add<=0&&mr<=0){period.textContent='도달 불가';return}while(b<T&&months<max){b*=1+mr;b+=add;months++}period.textContent=months>=max?'100년 이상':Math.floor(months/12)+'년 '+(months%12)+'개월'}calc()</script></div></body></html>
