<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>배당수익률 계산기 - 배당금·주가 기준 수익률 계산 | 머니계산기</title><meta name="description" content="주가와 연간 주당 배당금을 입력해 배당수익률과 투자금 기준 예상 연 배당금을 계산하세요."><style>body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f6f7f9;color:#16181d;line-height:1.65}.wrap{max-width:780px;margin:auto;padding:24px 16px 56px}a{color:#111827}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;margin:14px 0}label{display:block;font-size:14px;font-weight:700;color:#6b7280;margin:10px 0 6px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #e5e7eb;border-radius:12px;font-size:16px}button{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:#111827;color:#fff;font-weight:800;font-size:16px}.result{background:#eef2f7;border-radius:14px;padding:16px;margin-top:16px}.big{font-size:28px;font-weight:900}.row{display:flex;justify-content:space-between;gap:12px;margin:8px 0}.muted{color:#6b7280;font-size:14px}</style></head><body><div class="wrap"><a href="index.html">← 머니계산기 홈</a><h1>배당수익률 계산기</h1><p class="muted">주가와 연간 배당금으로 배당수익률을 계산합니다.</p><div class="card"><label>현재 주가</label><input id="price" type="number" value="50000"><label>연간 주당 배당금</label><input id="div" type="number" value="2500"><label>투자금 (선택)</label><input id="money" type="number" value="10000000"><button onclick="calc()">계산하기</button><div class="result"><div class="big" id="yieldv">-</div><div class="muted">배당수익률</div></div><div class="row"><span>매수 가능 주식수</span><strong id="shares">-</strong></div><div class="row"><span>예상 연 배당금</span><strong id="annual">-</strong></div></div><div class="card"><h2>배당수익률 계산식</h2><p>연간 주당 배당금 ÷ 현재 주가 × 100으로 계산합니다. 주가와 배당금이 변하면 실제 배당수익률도 달라집니다.</p><p class="muted">세금과 거래비용은 포함하지 않습니다.</p></div><script>const f=n=>new Intl.NumberFormat('ko-KR',{maximumFractionDigits:0}).format(Math.round(n))+'원';function calc(){const P=+price.value||0,D=+div.value||0,M=+money.value||0,Y=P?D/P*100:0,S=P?Math.floor(M/P):0;yieldv.textContent=Y.toFixed(2)+'%';shares.textContent=new Intl.NumberFormat('ko-KR').format(S)+'주';annual.textContent=f(S*D)}calc()</script></div></body></html>
