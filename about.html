<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사이트 소개 - 머니계산기</title><style>body{font-family:system-ui,-apple-system,sans-serif;max-width:760px;margin:40px auto;padding:0 18px;line-height:1.7;color:#16181d}a{color:inherit}h1{letter-spacing:-.03em}.box{background:#f6f7f9;border-radius:16px;padding:18px}</style></head><body><p><a href="index.html">← 머니계산기</a></p><h1>사이트 소개</h1><div class="box">머니계산기는 배당, 복리, 목표 월배당 등 자산 관련 계산을 빠르고 이해하기 쉽게 제공하는 무료 계산 도구입니다.</div><h2>운영 원칙</h2><p>계산에 사용한 가정과 공식을 가능한 한 명확하게 표시하고, 특정 금융상품 매수나 투자를 권유하지 않습니다.</p><h2>주의사항</h2><p>계산 결과는 단순 시뮬레이션이며 실제 세금, 수수료, 상품 구조, 시장 수익률에 따라 결과가 달라질 수 있습니다. 중요한 금융 의사결정 전에는 관련 전문가 또는 공식 자료를 확인하세요.</p></body></html>
