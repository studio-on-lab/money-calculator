<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>대출이자 계산기 - 원리금균등 월상환액 계산 | 머니계산기</title><meta name="description" content="대출금, 연이율, 상환기간을 입력해 원리금균등 기준 월 상환액, 총 상환액, 총 이자를 계산합니다."><style>body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f6f7f9;color:#16181d}.wrap{max-width:780px;margin:auto;padding:24px 16px 56px}a{color:#111827}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;margin:14px 0}label{display:block;font-size:14px;font-weight:700;color:#6b7280;margin:10px 0 6px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #e5e7eb;border-radius:12px;font-size:16px}button{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:#111827;color:#fff;font-weight:800;font-size:16px}.result{background:#eef2f7;border-radius:14px;padding:16px;margin-top:16px}.big{font-size:28px;font-weight:900}.row{display:flex;justify-content:space-between;gap:12px;margin:8px 0}.muted{color:#6b7280;font-size:14px}</style></head><body><div class="wrap"><a href="index.html">← 머니계산기 홈</a><h1>대출이자 계산기</h1><p class="muted">원리금균등상환 기준 월 상환액과 총 이자를 계산합니다.</p><div class="card"><label>대출금</label><input id="principal" type="number" value="100000000"><label>연이율 (%)</label><input id="rate" type="number" value="4" step="0.1"><label>상환기간 (년)</label><input id="years" type="number" value="20"><button onclick="calc()">계산하기</button><div class="result"><div class="big" id="monthly">-</div><div class="muted">예상 월 상환액</div></div><div class="row"><span>총 상환액</span><strong id="total">-</strong></div><div class="row"><span>총 이자</span><strong id="interest">-</strong></div></div><div class="card"><h2>계산 방식</h2><p>매월 같은 금액을 상환하는 원리금균등상환 공식으로 계산합니다.</p><p class="muted">실제 금융상품의 중도상환수수료, 보증료, 우대금리 등은 반영되지 않습니다.</p></div><script>const f=n=>new Intl.NumberFormat('ko-KR',{maximumFractionDigits:0}).format(Math.round(n))+'원';function calc(){let p=+principal.value||0,n=Math.max(1,Math.round((+years.value||0)*12)),r=(+rate.value||0)/100/12,m=r?p*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1):p/n,t=m*n;monthly.textContent=f(m);total.textContent=f(t);interest.textContent=f(t-p)}calc()</script></div></body></html>
