<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>복리 계산기 - 투자금 복리 성장 계산 | 머니계산기</title><meta name="description" content="초기 투자금, 연 수익률, 월 추가 투자금, 투자기간을 입력해 복리 기준 예상 최종자산과 투자수익을 계산합니다."><style>body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f6f7f9;color:#16181d}.wrap{max-width:780px;margin:auto;padding:24px 16px 56px}a{color:#111827}.top{margin-bottom:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:14px;font-weight:700;color:#6b7280;margin:10px 0 6px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #e5e7eb;border-radius:12px;font-size:16px}button{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:#111827;color:#fff;font-weight:800;font-size:16px}.result{background:#eef2f7;border-radius:14px;padding:16px;margin-top:16px}.big{font-size:28px;font-weight:900}.row{display:flex;justify-content:space-between;gap:12px;margin:8px 0}.muted{color:#6b7280;font-size:14px}@media(max-width:640px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><a href="index.html">← 머니계산기 홈</a><h1>복리 계산기</h1><p class="muted">투자금이 복리로 성장할 때 예상 자산을 계산합니다.</p></div><div class="card"><div class="grid"><div><label>초기 투자금</label><input id="p" type="number" value="10000000"><label>연 수익률 (%)</label><input id="r" type="number" value="8" step="0.1"></div><div><label>매월 추가 투자금</label><input id="m" type="number" value="500000"><label>투자 기간 (년)</label><input id="y" type="number" value="10"></div></div><button onclick="calc()">계산하기</button><div class="result"><div class="big" id="final">-</div><div class="muted">예상 최종자산</div></div><div class="row"><span>총 납입원금</span><strong id="contrib">-</strong></div><div class="row"><span>예상 투자수익</span><strong id="profit">-</strong></div></div><div class="card"><h2>복리 계산은 어떻게 하나요?</h2><p>연 수익률을 월 단위 복리 수익률로 환산해 매월 수익을 반영하고, 이후 월 추가 투자금을 더하는 방식으로 계산합니다.</p><p class="muted">실제 투자수익은 시장 변동, 세금, 수수료 등에 따라 달라질 수 있습니다.</p></div><script>const f=n=>new Intl.NumberFormat('ko-KR',{maximumFractionDigits:0}).format(Math.round(n))+'원';function calc(){let b=+p.value||0,annual=(+r.value||0)/100,add=+m.value||0,months=Math.max(0,Math.round((+y.value||0)*12)),mr=Math.pow(1+annual,1/12)-1;for(let i=0;i<months;i++){b*=1+mr;b+=add}let c=(+p.value||0)+add*months;final.textContent=f(b);contrib.textContent=f(c);profit.textContent=f(b-c)}calc()</script></div></body></html>
