<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>적금 계산기 - 월 납입액 만기금액 계산 | 머니계산기</title><meta name="description" content="월 납입액, 연이율, 기간을 입력해 단순 월복리 기준 예상 만기금액과 이자를 계산합니다."><style>body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f6f7f9;color:#16181d}.wrap{max-width:780px;margin:auto;padding:24px 16px 56px}a{color:#111827}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;margin:14px 0}label{display:block;font-size:14px;font-weight:700;color:#6b7280;margin:10px 0 6px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #e5e7eb;border-radius:12px;font-size:16px}button{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:#111827;color:#fff;font-weight:800;font-size:16px}.result{background:#eef2f7;border-radius:14px;padding:16px;margin-top:16px}.big{font-size:28px;font-weight:900}.row{display:flex;justify-content:space-between;gap:12px;margin:8px 0}.muted{color:#6b7280;font-size:14px}</style></head><body><div class="wrap"><a href="index.html">← 머니계산기 홈</a><h1>적금 계산기</h1><p class="muted">매월 일정 금액을 납입할 때 예상 만기금액을 계산합니다.</p><div class="card"><label>월 납입액</label><input id="monthly" type="number" value="500000"><label>연이율 (%)</label><input id="rate" type="number" value="3.5" step="0.1"><label>기간 (년)</label><input id="years" type="number" value="3" step="1"><button onclick="calc()">계산하기</button><div class="result"><div class="big" id="maturity">-</div><div class="muted">예상 만기금액</div></div><div class="row"><span>총 납입원금</span><strong id="principal">-</strong></div><div class="row"><span>예상 이자</span><strong id="interest">-</strong></div></div><div class="card"><h2>계산 방식</h2><p>매월 말 납입하고 월복리로 이자가 붙는 단순 시뮬레이션입니다.</p><p class="muted">실제 적금은 상품별 이자 계산방식, 세금, 납입일에 따라 결과가 다를 수 있습니다.</p></div><script>const f=n=>new Intl.NumberFormat('ko-KR',{maximumFractionDigits:0}).format(Math.round(n))+'원';function calc(){let m=+monthly.value||0,n=Math.max(0,Math.round((+years.value||0)*12)),r=(+rate.value||0)/100/12,b=0;for(let i=0;i<n;i++){b=(b+m)*(1+r)}let p=m*n;maturity.textContent=f(b);principal.textContent=f(p);interest.textContent=f(b-p)}calc()</script></div></body></html>
