<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>저축률 계산기 - 월급 대비 저축 비율 계산 | 머니계산기</title><meta name="description" content="월 실수령액과 월 저축·투자금액을 입력해 저축률과 소비 가능금액을 계산하세요."><style>body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f6f7f9;color:#16181d;line-height:1.65}.wrap{max-width:780px;margin:auto;padding:24px 16px 56px}a{color:#111827}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;margin:14px 0}label{display:block;font-size:14px;font-weight:700;color:#6b7280;margin:10px 0 6px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #e5e7eb;border-radius:12px;font-size:16px}button{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:#111827;color:#fff;font-weight:800;font-size:16px}.result{background:#eef2f7;border-radius:14px;padding:16px;margin-top:16px}.big{font-size:28px;font-weight:900}.row{display:flex;justify-content:space-between;gap:12px;margin:8px 0}.muted{color:#6b7280;font-size:14px}</style></head><body><div class="wrap"><a href="index.html">← 머니계산기 홈</a><h1>저축률 계산기</h1><p class="muted">월 소득 중 얼마를 저축·투자하는지 비율로 확인합니다.</p><div class="card"><label>월 실수령액</label><input id="income" type="number" value="4000000"><label>월 저축·투자금</label><input id="save" type="number" value="1500000"><button onclick="calc()">계산하기</button><div class="result"><div class="big" id="rate">-</div><div class="muted">저축률</div></div><div class="row"><span>월 소비 가능금액</span><strong id="spend">-</strong></div><div class="row"><span>연간 저축·투자금</span><strong id="year">-</strong></div></div><div class="card"><h2>저축률은 어떻게 계산하나요?</h2><p>월 저축·투자금 ÷ 월 실수령액 × 100으로 계산합니다. 저축과 투자에 실제로 배정하는 금액을 넣으면 현재 현금흐름을 간단히 확인할 수 있습니다.</p><p class="muted">생활비 구조와 목표에 따라 적절한 저축률은 달라집니다.</p></div><script>const f=n=>new Intl.NumberFormat('ko-KR',{maximumFractionDigits:0}).format(Math.round(n))+'원';function calc(){const I=+income.value||0,S=+save.value||0;rate.textContent=(I?S/I*100:0).toFixed(1)+'%';spend.textContent=f(I-S);year.textContent=f(S*12)}calc()</script></div></body></html>
