<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAGR 계산기 - 연평균 수익률 계산 | 머니계산기</title><meta name="description" content="시작금액, 최종금액, 기간을 입력해 연평균 복합성장률 CAGR을 계산합니다."><style>body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f6f7f9;color:#16181d}.wrap{max-width:780px;margin:auto;padding:24px 16px 56px}a{color:#111827}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;margin:14px 0}label{display:block;font-size:14px;font-weight:700;color:#6b7280;margin:10px 0 6px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #e5e7eb;border-radius:12px;font-size:16px}button{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:#111827;color:#fff;font-weight:800;font-size:16px}.result{background:#eef2f7;border-radius:14px;padding:16px;margin-top:16px}.big{font-size:28px;font-weight:900}.muted{color:#6b7280;font-size:14px}</style></head><body><div class="wrap"><a href="index.html">← 머니계산기 홈</a><h1>CAGR 계산기</h1><p class="muted">시작금액과 최종금액으로 연평균 복합성장률을 계산합니다.</p><div class="card"><label>시작금액</label><input id="start" type="number" value="10000000"><label>최종금액</label><input id="end" type="number" value="20000000"><label>기간 (년)</label><input id="years" type="number" value="5" step="0.1"><button onclick="calc()">계산하기</button><div class="result"><div class="big" id="out">-</div><div class="muted">연평균 복합성장률 (CAGR)</div></div></div><div class="card"><h2>CAGR이란?</h2><p>투자나 자산이 매년 같은 비율로 성장했다고 가정했을 때의 연평균 성장률입니다.</p><p class="muted">공식: (최종금액 ÷ 시작금액)^(1 ÷ 기간) - 1</p></div><script>function calc(){let s=+start.value||0,e=+end.value||0,y=+years.value||0;out.textContent=s>0&&e>0&&y>0?(((e/s)**(1/y)-1)*100).toFixed(2)+'%':'-' }calc()</script></div></body></html>
