<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>평단가 계산기 - 주식 물타기 평균단가 계산 | 머니계산기</title><meta name="description" content="기존 보유수량과 평균단가, 추가 매수 수량과 가격을 입력해 새로운 평균단가와 총 투자금을 계산합니다."><style>body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f6f7f9;color:#16181d}.wrap{max-width:780px;margin:auto;padding:24px 16px 56px}a{color:#111827}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:14px;font-weight:700;color:#6b7280;margin:10px 0 6px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #e5e7eb;border-radius:12px;font-size:16px}button{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:#111827;color:#fff;font-weight:800;font-size:16px}.result{background:#eef2f7;border-radius:14px;padding:16px;margin-top:16px}.big{font-size:28px;font-weight:900}.row{display:flex;justify-content:space-between;gap:12px;margin:8px 0}.muted{color:#6b7280;font-size:14px}@media(max-width:640px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><a href="index.html">← 머니계산기 홈</a><h1>평단가 계산기</h1><p class="muted">추가 매수 후 새로운 평균 매입단가를 계산합니다.</p><div class="card"><div class="grid"><div><label>기존 보유수량</label><input id="q1" type="number" value="100"><label>기존 평균단가</label><input id="p1" type="number" value="50000"></div><div><label>추가 매수수량</label><input id="q2" type="number" value="50"><label>추가 매수가격</label><input id="p2" type="number" value="40000"></div></div><button onclick="calc()">계산하기</button><div class="result"><div class="big" id="avg">-</div><div class="muted">새 평균단가</div></div><div class="row"><span>총 보유수량</span><strong id="qty">-</strong></div><div class="row"><span>총 투자금</span><strong id="total">-</strong></div></div><div class="card"><h2>계산 방식</h2><p>기존 투자금과 추가 투자금을 합친 뒤 전체 보유수량으로 나눠 새로운 평균단가를 계산합니다.</p><p class="muted">수수료와 세금은 반영하지 않은 단순 계산입니다.</p></div><script>const won=n=>new Intl.NumberFormat('ko-KR',{maximumFractionDigits:2}).format(n)+'원';function calc(){let a=+q1.value||0,b=+p1.value||0,c=+q2.value||0,d=+p2.value||0,q=a+c,t=a*b+c*d;avg.textContent=q?won(t/q):'-';qty.textContent=new Intl.NumberFormat('ko-KR').format(q)+'주';total.textContent=won(t)}calc()</script></div></body></html>
