<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>대출 상환방식 비교 계산기 - 원리금균등·원금균등 | 머니계산기</title><meta name="description" content="대출금, 금리, 기간을 입력해 원리금균등과 원금균등의 첫 달 상환액과 총 이자를 비교하세요."><style>body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f6f7f9;color:#16181d;line-height:1.65}.wrap{max-width:780px;margin:auto;padding:24px 16px 56px}a{color:#111827}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;margin:14px 0}label{display:block;font-size:14px;font-weight:700;color:#6b7280;margin:10px 0 6px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #e5e7eb;border-radius:12px;font-size:16px}button{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:#111827;color:#fff;font-weight:800;font-size:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.result{background:#eef2f7;border-radius:14px;padding:16px}.big{font-size:22px;font-weight:900}.row{display:flex;justify-content:space-between;gap:12px;margin:8px 0}.muted{color:#6b7280;font-size:14px}@media(max-width:640px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><a href="index.html">← 머니계산기 홈</a><h1>대출 상환방식 비교 계산기</h1><p class="muted">원리금균등과 원금균등 상환의 부담 차이를 비교합니다.</p><div class="card"><label>대출금</label><input id="p" type="number" value="300000000"><label>연 금리 (%)</label><input id="r" type="number" value="4" step="0.1"><label>기간 (년)</label><input id="y" type="number" value="30"><button onclick="calc()">비교하기</button></div><div class="grid"><div class="card result"><h2>원리금균등</h2><div class="big" id="aPay">-</div><div class="muted">월 상환액</div><div class="row"><span>총 이자</span><strong id="aInt">-</strong></div></div><div class="card result"><h2>원금균등</h2><div class="big" id="bFirst">-</div><div class="muted">첫 달 상환액</div><div class="row"><span>마지막 달</span><strong id="bLast">-</strong></div><div class="row"><span>총 이자</span><strong id="bInt">-</strong></div></div></div><div class="card"><h2>두 방식의 차이</h2><p>원리금균등은 매달 비슷한 금액을 상환해 초기 부담이 일정한 편입니다. 원금균등은 원금을 동일하게 나누어 갚아 초반 부담은 크지만 시간이 갈수록 상환액이 줄어듭니다.</p><p class="muted">실제 대출은 실행일, 일할이자, 중도상환, 수수료 등에 따라 달라질 수 있습니다.</p></div><script>const f=n=>new Intl.NumberFormat('ko-KR',{maximumFractionDigits:0}).format(Math.round(n))+'원';function calc(){const P=+p.value||0,mr=(+r.value||0)/1200,n=Math.max(1,Math.round((+y.value||0)*12));const pay=mr?P*mr*Math.pow(1+mr,n)/(Math.pow(1+mr,n)-1):P/n;const ai=pay*n-P;let bal=P,bi=0,first=0,last=0,principal=P/n;for(let i=0;i<n;i++){let interest=bal*mr;let total=principal+interest;if(i===0)first=total;if(i===n-1)last=total;bi+=interest;bal-=principal}aPay.textContent=f(pay);aInt.textContent=f(ai);bFirst.textContent=f(first);bLast.textContent=f(last);bInt.textContent=f(bi)}calc()</script></div></body></html>
